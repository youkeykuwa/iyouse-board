<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>匂わせ判定掲示板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFEDE6;
    --paper-raised:#F7F5EF;
    --ink:#20211C;
    --ink-soft:#5B5B52;
    --line:#C9C6BA;
    --line-strong:#20211C;
    --red:#C5432B;
    --red-bg:#F1D8D0;
    --yellow:#C99A2E;
    --yellow-bg:#F2E6C4;
    --green:#3E7A4C;
    --green-bg:#DCE9DC;
    --white-mark:#8A8A80;
    --white-bg:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .mono{font-family:'JetBrains Mono', monospace;}

  #app{max-width:640px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--paper); position:relative;}

  /* header */
  header{
    position:sticky; top:0; z-index:20;
    background:var(--paper);
    border-bottom:2px solid var(--line-strong);
    padding:14px 16px 12px;
  }
  .brand{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  .brand h1{
    font-size:19px; font-weight:900; letter-spacing:.02em; margin:0;
  }
  .brand h1 .mark{color:var(--red); margin-right:1px;}
  .my-id{
    font-size:11px; color:var(--ink-soft); text-align:right; line-height:1.5; white-space:nowrap;
  }
  .my-id .val{color:var(--ink); font-weight:700;}
  .tagline{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}

  main{flex:1; padding:0 0 96px;}

  /* list controls (search + tabs) */
  .list-controls{
    padding:12px 16px 0;
    background:var(--paper);
    border-bottom:1px solid var(--line);
  }
  .search-wrap{position:relative;}
  .search-input{
    width:100%;
    border:1.5px solid var(--line-strong);
    background:#fff;
    color:var(--ink);
    font-family:inherit;
    font-size:14px;
    padding:10px 34px 10px 10px;
  }
  .search-input:focus{outline:2px solid var(--ink); outline-offset:1px;}
  .search-clear{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:var(--ink-soft);
    font-size:16px; cursor:pointer; padding:2px 4px; line-height:1;
    display:none;
  }
  .search-input:not(:placeholder-shown) ~ .search-clear,
  .search-clear.show{display:block;}

  .tabs{display:flex; margin-top:10px; gap:0;}
  .tab{
    flex:1;
    background:none;
    border:1.5px solid var(--line-strong);
    border-bottom:none;
    color:var(--ink-soft);
    font-family:inherit;
    font-size:12px;
    font-weight:700;
    padding:9px 6px;
    cursor:pointer;
    margin-right:-1.5px;
    position:relative;
    top:1px;
  }
  .tab:last-child{margin-right:0;}
  .tab.active{
    background:var(--paper-raised);
    color:var(--ink);
    border-bottom:1.5px solid var(--paper-raised);
    top:0;
    padding-bottom:10.5px;
  }

  /* list */
  .thread-row{
    display:block; width:100%; text-align:left; background:none; border:none;
    border-bottom:1px solid var(--line);
    padding:14px 16px; cursor:pointer; font-family:inherit; color:inherit;
  }
  .thread-row:active{background:var(--paper-raised);}
  .thread-row .top-line{display:flex; justify-content:space-between; align-items:baseline; gap:10px;}
  .thread-row .title{font-size:15px; font-weight:700; line-height:1.5; flex:1;}
  .thread-row .count{font-size:11px; color:var(--ink-soft); white-space:nowrap; font-family:'JetBrains Mono',monospace;}
  .thread-row .meta{font-size:11px; color:var(--ink-soft); margin-top:3px; font-family:'JetBrains Mono',monospace;}
  .thread-row .excerpt{font-size:12.5px; color:var(--ink-soft); margin-top:6px; line-height:1.5; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}

  .rank-badge{
    display:inline-block;
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    font-weight:700;
    color:var(--paper);
    background:var(--ink);
    padding:1px 6px;
    margin-right:6px;
    vertical-align:1px;
  }
  .rank-badge.r1{background:var(--red);}
  .rank-badge.r2{background:var(--yellow);}
  .rank-badge.r3{background:var(--green);}

  .row-reactions{
    display:flex; gap:12px; margin-top:8px;
    font-size:11px; color:var(--ink-soft);
    font-family:'JetBrains Mono',monospace;
  }
  .row-reactions span{display:flex; align-items:center; gap:3px;}

  .tally-bar{display:flex; height:6px; width:100%; margin-top:9px; border:1px solid var(--line-strong); overflow:hidden;}
  .tally-bar .seg{height:100%;}
  .seg.red{background:var(--red);}
  .seg.yellow{background:var(--yellow);}
  .seg.green{background:var(--green);}
  .seg.white{background:#fff; border-right:1px solid var(--line);}
  .tally-nums{display:flex; gap:10px; margin-top:6px; font-size:10.5px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace;}
  .tally-nums span{display:flex; align-items:center; gap:3px;}
  .dot{width:7px; height:7px; display:inline-block; border:1px solid var(--line-strong);}
  .dot.red{background:var(--red);} .dot.yellow{background:var(--yellow);} .dot.green{background:var(--green);} .dot.white{background:#fff;}

  .empty-state{padding:60px 24px; text-align:center; color:var(--ink-soft); font-size:13.5px; line-height:1.8;}
  .empty-state .big{font-size:26px; margin-bottom:10px; letter-spacing:.3em;}

  /* fab */
  .fab{
    position:fixed; left:50%; bottom:20px; transform:translateX(calc(-50% + 0px));
    width:min(640px, 100%); pointer-events:none;
  }
  .fab-inner{max-width:640px; margin:0 auto; padding:0 16px; display:flex; justify-content:flex-end;}
  .fab button{
    pointer-events:auto;
    background:var(--ink); color:var(--paper);
    border:none; padding:14px 20px; font-size:14px; font-weight:700;
    font-family:inherit; cursor:pointer; display:flex; align-items:center; gap:8px;
    box-shadow:0 2px 0 var(--line-strong);
  }
  .fab button:active{transform:translateY(1px); box-shadow:none;}

  /* thread detail */
  .detail-header{
    padding:12px 16px 14px; border-bottom:1px solid var(--line);
  }
  .back-btn{
    background:none; border:none; font-family:inherit; font-size:13px; color:var(--ink-soft);
    cursor:pointer; padding:0 0 10px; display:flex; align-items:center; gap:4px;
  }
  .detail-title{font-size:17px; font-weight:900; line-height:1.5;}
  .detail-meta{font-size:11px; color:var(--ink-soft); margin-top:6px; font-family:'JetBrains Mono',monospace;}

  .post{
    padding:14px 16px; border-bottom:1px solid var(--line);
  }
  .post .post-meta{font-size:11px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; margin-bottom:6px; display:flex; gap:8px;}
  .post .post-meta .pid{color:var(--ink); font-weight:700;}
  .post .post-body{font-size:14px; line-height:1.75; white-space:pre-wrap; word-break:break-word;}
  .op .post-body{font-size:14.5px;}

  .verdict-panel{
    padding:16px; border-bottom:1px solid var(--line); background:var(--paper-raised);
  }
  .verdict-label{font-size:11px; color:var(--ink-soft); margin-bottom:10px; font-family:'JetBrains Mono',monospace;}
  .verdict-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .stamp{
    border:2px solid var(--line-strong); background:#fff; padding:12px 8px;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    cursor:pointer; font-family:inherit;
  }
  .stamp .sq{width:20px; height:20px; border:1.5px solid var(--line-strong);}
  .stamp .lbl{font-size:12px; font-weight:700;}
  .stamp .cnt{font-size:16px; font-weight:900; font-family:'JetBrains Mono',monospace;}
  .stamp.red .sq{background:var(--red);} .stamp.red.active{background:var(--red-bg); border-color:var(--red);}
  .stamp.yellow .sq{background:var(--yellow);} .stamp.yellow.active{background:var(--yellow-bg); border-color:var(--yellow);}
  .stamp.green .sq{background:var(--green);} .stamp.green.active{background:var(--green-bg); border-color:var(--green);}
  .stamp.white .sq{background:#fff;} .stamp.white.active{background:var(--white-bg); border-color:var(--ink-soft);}
  .stamp:active{transform:scale(.97);}
  .verdict-hint{font-size:11px; color:var(--ink-soft); margin-top:10px; line-height:1.6;}

  /* reaction bar */
  .reaction-bar{
    padding:14px 16px;
    border-bottom:8px solid var(--line-strong);
    background:var(--paper-raised);
    display:flex; gap:10px;
  }
  .reaction-btn{
    flex:1;
    display:flex; align-items:center; justify-content:center; gap:6px;
    background:#fff;
    border:1.5px solid var(--line-strong);
    color:var(--ink);
    font-family:inherit; font-size:13px; font-weight:700;
    padding:11px 8px;
    cursor:pointer;
  }
  .reaction-btn .cnt{font-family:'JetBrains Mono',monospace; font-weight:700;}
  .reaction-btn.active[data-react="up"]{background:var(--green-bg); border-color:var(--green); color:var(--green);}
  .reaction-btn.active[data-react="down"]{background:var(--red-bg); border-color:var(--red); color:var(--red);}
  .reaction-btn:active{transform:scale(.98);}

  .reply-form{padding:14px 16px; display:flex; flex-direction:column; gap:8px;}
  textarea{
    width:100%; border:1.5px solid var(--line-strong); background:#fff; color:var(--ink);
    font-family:inherit; font-size:14px; padding:10px; resize:vertical; min-height:70px;
  }
  textarea:focus{outline:2px solid var(--ink); outline-offset:1px;}
  .row-btn{
    align-self:flex-end; background:var(--ink); color:var(--paper); border:none;
    padding:10px 18px; font-size:13px; font-weight:700; font-family:inherit; cursor:pointer;
  }
  .row-btn:disabled{opacity:.4; cursor:default;}

  /* overlay / new thread */
  .overlay{
    position:fixed; inset:0; background:rgba(32,33,28,.5); z-index:40;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .sheet{
    background:var(--paper); width:100%; max-width:640px; max-height:88vh; overflow-y:auto;
    border-top:3px solid var(--ink); padding:18px 16px 24px;
  }
  .sheet h2{font-size:16px; font-weight:900; margin:0 0 4px;}
  .sheet .sub{font-size:11.5px; color:var(--ink-soft); margin-bottom:16px;}
  label{display:block; font-size:11px; color:var(--ink-soft); margin:14px 0 6px; font-family:'JetBrains Mono',monospace;}
  input[type=text]{
    width:100%; border:1.5px solid var(--line-strong); background:#fff; color:var(--ink);
    font-family:inherit; font-size:14px; padding:10px;
  }
  input[type=text]:focus{outline:2px solid var(--ink); outline-offset:1px;}
  .sheet-actions{display:flex; gap:10px; margin-top:20px;}
  .btn-secondary{
    flex:1; background:none; border:1.5px solid var(--line-strong); color:var(--ink);
    padding:12px; font-size:13.5px; font-weight:700; font-family:inherit; cursor:pointer;
  }
  .btn-primary{
    flex:1; background:var(--ink); border:1.5px solid var(--ink); color:var(--paper);
    padding:12px; font-size:13.5px; font-weight:700; font-family:inherit; cursor:pointer;
  }
  .btn-primary:disabled{opacity:.4;}
  .err-msg{font-size:12px; color:var(--red); margin-top:8px;}

  .loading{padding:60px 20px; text-align:center; color:var(--ink-soft); font-size:12.5px; font-family:'JetBrains Mono',monospace;}
</style>
</head>
<body>
<div id="app"></div>

<script>
const STORAGE_ERR = 'ストレージへの接続に失敗しました。時間をおいて再度お試しください。';
const DAY_MS = 24 * 60 * 60 * 1000;

// ---------- utilities ----------
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function genShortId(len){
  const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  let s='';
  for(let i=0;i<len;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function fmtTime(iso){
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const JUDGE_KEYS = ['red','yellow','green','white'];
const JUDGE_META = {
  red:    {label:'匂わせ',       },
  yellow: {label:'グレー',       },
  green:  {label:'匂わせではない',},
  white:  {label:'判断不能',     },
};
function emptyJudge(){ return {red:0, yellow:0, green:0, white:0}; }
function emptyReactions(){ return {up:0, down:0}; }
function judgeTotal(j){ return JUDGE_KEYS.reduce((a,k)=>a+(j?.[k]||0),0); }

// ---------- state ----------
const state = {
  view: 'loading',      // loading | list | thread | error
  index: [],
  currentThread: null,
  myId: null,
  loadError: null,
  showNewSheet: false,
  posting: false,
  query: '',
  tab: 'new',           // 'new' | 'rank'
};

// ---------- storage layer ----------
async function getMyId(){
  const key = `my-id-${todayStr()}`;
  try{
    const res = await window.storage.get(key, false);
    if(res && res.value) return res.value;
  }catch(e){ /* not found, fall through */ }
  const id = genShortId(8);
  try{
    await window.storage.set(key, id, false);
  }catch(e){ console.error('id save failed', e); }
  return id;
}

async function loadIndex(){
  try{
    const res = await window.storage.get('threads-index', true);
    if(res && res.value) return JSON.parse(res.value);
    return [];
  }catch(e){
    return [];
  }
}
async function saveIndex(list){
  const r = await window.storage.set('threads-index', JSON.stringify(list), true);
  if(!r) throw new Error('index save failed');
}
async function loadThread(id){
  const res = await window.storage.get(`thread-${id}`, true);
  if(!res || !res.value) throw new Error('thread not found');
  return JSON.parse(res.value);
}
async function saveThread(id, obj){
  const r = await window.storage.set(`thread-${id}`, JSON.stringify(obj), true);
  if(!r) throw new Error('thread save failed');
}

// ---------- actions ----------
async function createThread(title, body){
  const id = `${Date.now()}-${genShortId(4)}`;
  const now = new Date().toISOString();
  const thread = {
    id, title,
    createdAt: now,
    lastActivity: now,
    judge: emptyJudge(),
    voters: {},
    reactions: emptyReactions(),
    reactors: {},
    posts: [{ id: 'op', authorId: state.myId, body, createdAt: now }],
  };
  await saveThread(id, thread);
  const summary = {
    id, title,
    createdAt: now, lastActivity: now,
    excerpt: body.slice(0,80),
    postCount: 1,
    judge: emptyJudge(),
    reactions: emptyReactions(),
  };
  const list = [summary, ...state.index];
  await saveIndex(list);
  state.index = list;
  return id;
}

async function addReply(threadId, body){
  const thread = await loadThread(threadId);
  const now = new Date().toISOString();
  thread.posts.push({ id: genShortId(6), authorId: state.myId, body, createdAt: now });
  thread.lastActivity = now;
  await saveThread(threadId, thread);
  const idx = state.index.findIndex(t=>t.id===threadId);
  if(idx>-1){
    state.index[idx].postCount = thread.posts.length;
    state.index[idx].lastActivity = now;
    await saveIndex(state.index);
  }
  return thread;
}

async function castVote(threadId, color){
  const thread = await loadThread(threadId);
  const prev = thread.voters[state.myId];
  if(prev === color) return thread; // no-op, already voted this
  if(prev && thread.judge[prev] > 0) thread.judge[prev] -= 1;
  thread.judge[color] = (thread.judge[color]||0) + 1;
  thread.voters[state.myId] = color;
  await saveThread(threadId, thread);
  const idx = state.index.findIndex(t=>t.id===threadId);
  if(idx>-1){
    state.index[idx].judge = thread.judge;
    await saveIndex(state.index);
  }
  return thread;
}

async function castReaction(threadId, kind){ // 'up' | 'down'
  const thread = await loadThread(threadId);
  thread.reactions = thread.reactions || emptyReactions();
  thread.reactors  = thread.reactors  || {};
  const prev = thread.reactors[state.myId];
  if(prev === kind){
    // toggle off
    thread.reactions[kind] = Math.max(0, (thread.reactions[kind]||0) - 1);
    delete thread.reactors[state.myId];
  }else{
    if(prev) thread.reactions[prev] = Math.max(0, (thread.reactions[prev]||0) - 1);
    thread.reactions[kind] = (thread.reactions[kind]||0) + 1;
    thread.reactors[state.myId] = kind;
  }
  await saveThread(threadId, thread);
  const idx = state.index.findIndex(t=>t.id===threadId);
  if(idx>-1){
    state.index[idx].reactions = thread.reactions;
    await saveIndex(state.index);
  }
  return thread;
}

// ---------- ranking ----------
function rankScore(t){
  const j  = judgeTotal(t.judge || emptyJudge());
  const up = t.reactions?.up   || 0;
  const dn = t.reactions?.down || 0;
  const pc = t.postCount || 0;
  return j * 1 + up * 3 - dn * 2 + pc * 0.5;
}

// ---------- render ----------
const app = document.getElementById('app');

function render(){
  if(state.view === 'loading'){
    app.innerHTML = headerHtml() + `<main><div class="loading">読み込み中 ...</div></main>`;
    return;
  }
  if(state.view === 'error'){
    app.innerHTML = headerHtml() + `<main><div class="loading">${escapeHtml(state.loadError||STORAGE_ERR)}</div></main>`;
    return;
  }
  if(state.view === 'thread' && state.currentThread){
    app.innerHTML = headerHtml() + threadHtml(state.currentThread) + fabHtml(false);
  } else {
    app.innerHTML = headerHtml() + listHtml() + fabHtml(true);
  }
  if(state.showNewSheet){
    app.innerHTML += newThreadSheetHtml();
  }
  bindEvents();
}

function headerHtml(){
  return `
  <header>
    <div class="brand">
      <h1><span class="mark">匂</span>わせ判定掲示板</h1>
      <div class="my-id">本日のID<br><span class="val mono">${state.myId || '----'}</span></div>
    </div>
    <div class="tagline">気になる投稿を貼って、みんなで色をつける。IDは24時間で変わります。</div>
  </header>`;
}

function tallyBarHtml(judge){
  const total = judgeTotal(judge) || 0;
  if(total === 0){
    return `<div class="tally-bar"><div class="seg white" style="width:100%"></div></div>
      <div class="tally-nums"><span>まだ判定なし</span></div>`;
  }
  const segs = JUDGE_KEYS.map(k => `<div class="seg ${k}" style="width:${(judge[k]/total*100).toFixed(1)}%"></div>`).join('');
  const nums = JUDGE_KEYS.map(k => `<span><span class="dot ${k}"></span>${judge[k]}</span>`).join('');
  return `<div class="tally-bar">${segs}</div><div class="tally-nums">${nums}</div>`;
}

function listHtml(){
  return `<main>
    <div class="list-controls">
      <div class="search-wrap">
        <input id="search-input" class="search-input" type="text"
               placeholder="🔍 タイトル・抜粋を検索"
               value="${escapeHtml(state.query)}">
        <button class="search-clear ${state.query ? 'show' : ''}" id="search-clear" aria-label="クリア">✕</button>
      </div>
      <div class="tabs">
        <button class="tab ${state.tab==='new'?'active':''}"  data-tab="new">🆕 新着</button>
        <button class="tab ${state.tab==='rank'?'active':''}" data-tab="rank">🏆 24時間ランキング</button>
      </div>
    </div>
    <div id="list-container">${listRowsHtml()}</div>
  </main>`;
}

function listRowsHtml(){
  const q = state.query.trim().toLowerCase();
  let list = state.index.filter(t =>
    !q || (t.title||'').toLowerCase().includes(q) || (t.excerpt||'').toLowerCase().includes(q)
  );

  if(state.tab === 'rank'){
    const cut = Date.now() - DAY_MS;
    list = list.filter(t => new Date(t.lastActivity).getTime() >= cut);
    list.sort((a,b) => rankScore(b) - rankScore(a));
  }else{
    list.sort((a,b) => new Date(b.lastActivity) - new Date(a.lastActivity));
  }

  if(state.index.length === 0){
    return `<div class="empty-state"><div class="big">⬜ ⬜ ⬜</div>まだスレッドがありません。<br>最初のスレを立ててみましょう。</div>`;
  }
  if(list.length === 0){
    const msg = state.tab === 'rank'
      ? '24時間以内に更新されたスレッドがありません。'
      : '該当するスレッドが見つかりません。';
    return `<div class="empty-state">${msg}</div>`;
  }

  return list.map((t, i) => {
    const rankBadge = (state.tab === 'rank' && i < 3)
      ? `<span class="rank-badge r${i+1}">${i+1}位</span>` : '';
    const up = t.reactions?.up || 0;
    const dn = t.reactions?.down || 0;
    const reactionsRow = (up || dn)
      ? `<div class="row-reactions"><span>👍 ${up}</span><span>👎 ${dn}</span></div>`
      : '';
    return `
    <button class="thread-row" data-open="${t.id}">
      <div class="top-line">
        <div class="title">${rankBadge}${escapeHtml(t.title)}</div>
        <div class="count">${t.postCount}件</div>
      </div>
      <div class="meta">${fmtTime(t.lastActivity)} 更新</div>
      <div class="excerpt">${escapeHtml(t.excerpt||'')}</div>
      ${tallyBarHtml(t.judge)}
      ${reactionsRow}
    </button>`;
  }).join('');
}

function threadHtml(t){
  const op = t.posts[0];
  const replies = t.posts.slice(1);
  const myVote = t.voters?.[state.myId];
  const stamps = JUDGE_KEYS.map(k => {
    const meta = JUDGE_META[k];
    return `<button class="stamp ${k} ${myVote===k?'active':''}" data-vote="${k}">
      <span class="sq"></span>
      <span class="lbl">${meta.label}</span>
      <span class="cnt mono">${t.judge[k]||0}</span>
    </button>`;
  }).join('');

  const myR = t.reactors?.[state.myId];
  const up = t.reactions?.up   || 0;
  const dn = t.reactions?.down || 0;
  const reactionBar = `
    <div class="reaction-bar">
      <button class="reaction-btn ${myR==='up'?'active':''}" data-react="up">
        👍 参考になった <span class="cnt">${up}</span>
      </button>
      <button class="reaction-btn ${myR==='down'?'active':''}" data-react="down">
        👎 参考にならない <span class="cnt">${dn}</span>
      </button>
    </div>`;

  const replyRows = replies.map(p => `
    <div class="post">
      <div class="post-meta"><span class="pid">${escapeHtml(p.authorId)}</span><span>${fmtTime(p.createdAt)}</span></div>
      <div class="post-body">${escapeHtml(p.body)}</div>
    </div>`).join('');

  return `
  <main>
    <div class="detail-header">
      <button class="back-btn" data-back="1">← 一覧に戻る</button>
      <div class="detail-title">${escapeHtml(t.title)}</div>
      <div class="detail-meta">${fmtTime(t.createdAt)} 作成 / ${t.posts.length}件</div>
    </div>
    <div class="post op">
      <div class="post-meta"><span class="pid">${escapeHtml(op.authorId)}</span><span>${fmtTime(op.createdAt)}</span></div>
      <div class="post-body">${escapeHtml(op.body)}</div>
    </div>
    <div class="verdict-panel">
      <div class="verdict-label">この投稿の判定</div>
      <div class="verdict-grid">${stamps}</div>
      <div class="verdict-hint">タップで投票（変更可）。1つのIDにつき1票、24時間ごとにIDが変わります。</div>
    </div>
    ${reactionBar}
    ${replyRows}
    <div class="reply-form">
      <textarea id="reply-input" placeholder="コメントを書く"></textarea>
      <button class="row-btn" id="reply-submit">書き込む</button>
      <div class="err-msg" id="reply-err" style="display:none;"></div>
    </div>
  </main>`;
}

function fabHtml(show){
  if(!show) return '';
  return `<div class="fab"><div class="fab-inner"><button id="new-thread-btn">＋ スレを立てる</button></div></div>`;
}

function newThreadSheetHtml(){
  return `
  <div class="overlay" id="overlay">
    <div class="sheet">
      <h2>スレを立てる</h2>
      <div class="sub">気になった投稿の内容を書いてください。みんなが🟥🟨🟩⬜で判定します。</div>
      <label for="nt-title">タイトル</label>
      <input type="text" id="nt-title" maxlength="60" placeholder="例：〇〇の私服がまた〇〇と同じ？">
      <label for="nt-body">内容</label>
      <textarea id="nt-body" maxlength="1000" placeholder="状況や根拠を書いてください"></textarea>
      <div class="err-msg" id="nt-err" style="display:none;"></div>
      <div class="sheet-actions">
        <button class="btn-secondary" id="nt-cancel">キャンセル</button>
        <button class="btn-primary" id="nt-submit">投稿する</button>
      </div>
    </div>
  </div>`;
}

// ---------- events ----------
function bindRowOpen(){
  document.querySelectorAll('[data-open]').forEach(el => {
    el.onclick = () => openThread(el.getAttribute('data-open'));
  });
}

function bindEvents(){
  const openBtn = document.getElementById('new-thread-btn');
  if(openBtn) openBtn.onclick = () => { state.showNewSheet = true; render(); };

  const cancel = document.getElementById('nt-cancel');
  if(cancel) cancel.onclick = () => { state.showNewSheet = false; render(); };
  const overlay = document.getElementById('overlay');
  if(overlay) overlay.onclick = (e) => { if(e.target.id==='overlay'){ state.showNewSheet = false; render(); } };

  const ntSubmit = document.getElementById('nt-submit');
  if(ntSubmit) ntSubmit.onclick = async () => {
    const title = document.getElementById('nt-title').value.trim();
    const body = document.getElementById('nt-body').value.trim();
    const err = document.getElementById('nt-err');
    if(!title || !body){
      err.textContent = 'タイトルと内容を入力してください。';
      err.style.display = 'block';
      return;
    }
    ntSubmit.disabled = true;
    ntSubmit.textContent = '投稿中...';
    try{
      const id = await createThread(title, body);
      state.showNewSheet = false;
      await openThread(id);
    }catch(e){
      err.textContent = STORAGE_ERR;
      err.style.display = 'block';
      ntSubmit.disabled = false;
      ntSubmit.textContent = '投稿する';
    }
  };

  bindRowOpen();

  // search
  const si = document.getElementById('search-input');
  const sc = document.getElementById('search-clear');
  if(si){
    si.oninput = () => {
      state.query = si.value;
      if(sc) sc.classList.toggle('show', !!state.query);
      const cont = document.getElementById('list-container');
      if(cont){
        cont.innerHTML = listRowsHtml();
        bindRowOpen();
      }
    };
    // フォーカス時にカーソルを末尾へ（部分再描画では飛ばないが念のため）
    if(state.query){
      si.focus();
      const v = si.value; si.value = ''; si.value = v;
    }
  }
  if(sc){
    sc.onclick = () => {
      state.query = '';
      if(si) si.value = '';
      sc.classList.remove('show');
      const cont = document.getElementById('list-container');
      if(cont){
        cont.innerHTML = listRowsHtml();
        bindRowOpen();
      }
      if(si) si.focus();
    };
  }

  // tabs
  document.querySelectorAll('[data-tab]').forEach(el => {
    el.onclick = () => {
      const t = el.getAttribute('data-tab');
      if(state.tab === t) return;
      state.tab = t;
      render();
    };
  });

  const back = document.querySelector('[data-back]');
  if(back) back.onclick = () => { state.view = 'list'; state.currentThread = null; render(); };

  document.querySelectorAll('[data-vote]').forEach(el => {
    el.onclick = async () => {
      const color = el.getAttribute('data-vote');
      try{
        const updated = await castVote(state.currentThread.id, color);
        state.currentThread = updated;
        render();
      }catch(e){
        alert(STORAGE_ERR);
      }
    };
  });

  document.querySelectorAll('[data-react]').forEach(el => {
    el.onclick = async () => {
      const kind = el.getAttribute('data-react');
      try{
        const updated = await castReaction(state.currentThread.id, kind);
        state.currentThread = updated;
        render();
      }catch(e){
        alert(STORAGE_ERR);
      }
    };
  });

  const replySubmit = document.getElementById('reply-submit');
  if(replySubmit) replySubmit.onclick = async () => {
    const input = document.getElementById('reply-input');
    const err = document.getElementById('reply-err');
    const body = input.value.trim();
    if(!body){
      err.textContent = 'コメントを入力してください。';
      err.style.display = 'block';
      return;
    }
    replySubmit.disabled = true;
    try{
      const updated = await addReply(state.currentThread.id, body);
      state.currentThread = updated;
      render();
    }catch(e){
      err.textContent = STORAGE_ERR;
      err.style.display = 'block';
      replySubmit.disabled = false;
    }
  };
}

async function openThread(id){
  state.view = 'loading'; render();
  try{
    const thread = await loadThread(id);
    state.currentThread = thread;
    state.view = 'thread';
  }catch(e){
    state.view = 'list';
  }
  render();
}

// ---------- init ----------
async function init(){
  render();
  state.myId = await getMyId();
  try{
    state.index = await loadIndex();
    state.view = 'list';
  }catch(e){
    state.view = 'error';
    state.loadError = STORAGE_ERR;
  }
  render();
}
init();
</script>
</body>
</html>
